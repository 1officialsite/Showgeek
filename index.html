function answer(i){let g=game;if(!g||g.locked||g.finished||g.hidden.includes(i))return;g.locked=true;g.selected=i;let ok=g.options[i]===g.q.correct;if(ok){g.right++;g.streak++;g.bestStreak=Math.max(g.bestStreak,g.streak);g.score=g.mode==='million'?prizes[g.right-1]:g.score+100+(g.q.d-1)*50+(g.mode==='time'?Math.min(50,g.remaining):0)}else{g.wrong++;g.streak=0;}if(g.mode==='duel'&&Math.random()<(g.q.d===3?.45:g.q.d===2?.65:.85))g.cpu++;if(g.mode!=='time')clearInterval(timer);feedback(ok);render();let token=g.token;setTimeout(()=>{if(!game||game.token!==token||game.finished)return;g.index++;if(!ok&&['million','infinite'].includes(g.mode))finish('wrong');else nextQuestion()},g.mode==='time'?500:1050)}
function useLife(id){let g=game;if(!g||g.locked||!available(id))return;if(id==='half'&&g.hidden.length)return toast('O 50/50 já foi aplicado nesta pergunta.');let replacement;if(id==='skip'){replacement=shuffle(activeBank().filter(q=>!g.asked.has(q.id)&&!g.queue.some(x=>x.id===q.id)&&(!g.cat||q.cat===g.cat)&&(g.mode!=='million'||q.d===g.q.d)))[0];if(!replacement){let idx=g.queue.findIndex(q=>!g.asked.has(q.id)&&(g.mode!=='million'||q.d===g.q.d));if(idx>=0)replacement=g.queue.splice(idx,1)[0]}if(!replacement)return toast('Não há outra pergunta disponível.');}if(g.used[id]>=1)data.stock[id]--;g.used[id]++;data.stats.help++;save();if(id==='half')g.hidden=shuffle(g.options.map((a,i)=>a===g.q.correct?-1:i).filter(i=>i>=0)).slice(0,2);if(id==='people'){let right=g.options.indexOf(g.q.correct);let votes=[10,10,10,10];votes[right]=70;g.hint='Nerds (simulação): '+votes.map((n,i)=>'ABCD'[i]+': '+n+'%').join(' · ')}if(id==='oracle')g.hint='Oráculo: '+(g.q.hint||'A resposta começa com '+g.q.correct[0]+'.');if(id==='skip'){tick();if(!g.finished&&!g.locked){g.queue.unshift(replacement);nextQuestion()}return}render()}
function finish(reason){let g=game;if(!g||g.finished)return;g.finished=true;clearInterval(timer);closeModal();stopVoice();let won=g.mode==='million'?g.right===15:g.mode==='duel'?g.right>g.cpu:g.mode==='daily'||g.mode==='category'?g.right>=7:g.mode==='time'?g.right>=5:g.right>=10;let reward=reason==='quit'?0:Math.min(1500,g.right*35+(won?150:0)+(g.mode==='million'&&won?500:0));let bonus=0;if(g.mode==='daily'&&reason!=='quit'&&!data.daily[dateKey()]){data.daily[dateKey()]=true;if(g.right>=7)bonus=200}let xp=Math.max(0,Math.min(g.right*25+g.wrong*5,xpFloor(999)-data.xp));data.played++;data.right+=g.right;data.wrong+=g.wrong;data.coins+=reward+bonus;data.xp=Math.min(xpFloor(999),data.xp+xp);let t=data.stats;t.streak=Math.max(t.streak,g.bestStreak||0);if(reason!=='quit'){t.completed++;t.wins+=won?1:0;t.score+=g.score;t.best=Math.max(t.best,g.score);t.earned+=reward+bonus;if(g.mode==='million'&&won)t.millionWon=true;}let result={mode:g.mode,cat:g.cat,name:data.name,score:g.score,right:g.right,wrong:g.wrong,cpu:g.cpu,won:won&&reason!=='quit',at:Date.now(),reason,reward:reward+bonus,xp};if(reason!=='quit')data.history=[result,...data.history].slice(0,250);save();lastResult=result;game=null;screen='result';render();if(result.won)confetti()}
function resultPage(){let r=lastResult;if(!r)return home();return `<div class="result"><div class="kicker">${modeOf(r.mode).name} · FIM DE JOGO</div><div class="result-emblem" style="${r.won?'':'color:var(--cyan);border-color:var(--cyan);background:radial-gradient(circle,#345572,#202347 70%)'}">${I(r.won?'trophy':'target')}</div><h1 class="title">${r.won?'VITÓRIA GEEK!':r.reason==='quit'?'Partida encerrada':'Fim de show!'}</h1><p class="sub">${r.won?'Você brilhou no palco!':'Todo desafio é uma chance de aprender.'}</p><div class="bigscore">${F(r.score)}</div><div class="kicker">PONTOS CONQUISTADOS</div><div class="space"></div><div class="statgrid">${stat('check',r.right,'Acertos')}${stat('x',r.wrong,'Erros')}${stat('star','+'+F(r.xp),'XP')}${stat('shop','+'+F(r.reward),'Moedas')}</div>${r.mode==='duel'?`<div class="panel">Você ${r.right} × ${r.cpu} CPU</div>`:''}<div class="actions"><button class="gold" data-act="replay">${I('play')} JOGAR NOVAMENTE</button><button class="secondary" data-go="ranking">${I('rank')} VER RANKING</button><button class="secondary" data-go="home">${I('home')} VOLTAR AO INÍCIO</button></div></div>`}
function confetti(){if(data.settings.reduce||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const box=document.createElement('div');box.className='confetti';box.innerHTML=Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#ffcf67','#a552ff','#38d7ff'][i%3]};animation-delay:${Math.random()}s;transform:rotate(${i*30}deg)"></i>`).join('');app.append(box);setTimeout(()=>box.remove(),4100)}
function render(){let prev=app.querySelector('.main'),same=prev?.classList.contains('screen-'+screen),offset=same?(prev.querySelector('.inner-scroll')?.scrollTop||0):0;apply();let pages={home,modes:modesPage,categories,daily,profile,achievements,settings,shop,ranking,game:gamePage,result:resultPage};let playing=screen==='game';app.innerHTML=(playing?'':header())+`<main class="main screen-${screen}" id="main">${(pages[screen]||home)()}</main>`+(playing||screen==='result'?'':nav());if(same){let list=app.querySelector('.inner-scroll');if(list)list.scrollTop=offset;}}
function go(to){if(game&&screen==='game'){return confirmQuit(to)}screen=to;render();window.scrollTo(0,0)}
function modal(title,body,buttons){overlay.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><h2>${E(title)}</h2>${body}<div class="actions">${buttons}</div></section></div>`;modalOpen=true;let el=overlay.querySelector('input,button');if(el)el.focus()}
function closeModal(){overlay.innerHTML='';modalOpen=false}function confirmQuit(to){modal('Sair da partida?','<p>Seus acertos e erros serão contabilizados, mas a partida não renderá moedas nem entrará no ranking. O cronômetro continua durante esta confirmação.</p>','<button class="secondary" data-act="cancel">Continuar jogando</button><button class="secondary danger" data-act="quitconfirm">Sair da partida</button>')}
function toast(s){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=s;document.body.append(d);toastTimer=setTimeout(()=>d.remove(),2400)}
let audio;function beep(ok){if(!data.settings.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;[ok?523:220,ok?784:146].forEach((f,i)=>{let o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.09,t+i*.09);v.gain.exponentialRampToValueAtTime(.001,t+i*.09+.18);o.connect(v);v.connect(audio.destination);o.start(t+i*.09);o.stop(t+i*.09+.2)})}catch{}}
function feedback(ok){beep(ok);if(data.settings.vibration&&navigator.vibrate)try{navigator.vibrate(ok?35:[45,45,45])}catch{}}
function stopVoice(){try{window.speechSynthesis?.cancel()}catch{}}
function speak(text,force=false){if(!force&&!data.settings.voice)return;if(!('speechSynthesis'in window))return force&&toast('Narração indisponível neste navegador.');try{stopVoice();let u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.95;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang==='pt-BR'&&v.localService)||voices.find(v=>v.lang==='pt-BR');if(v)u.voice=v;u.onerror=()=>{if(force)toast('Voz indisponível no dispositivo.')};speechSynthesis.speak(u)}catch{if(force)toast('Narração indisponível.')}}
function buy(id){let i=items.find(x=>x.id===id);if(!i)return;if(i.type==='theme'&&data.unlocked.includes(id))return toast('Tema já desbloqueado.');if(data.coins<i.price)return toast('Moedas insuficientes. Jogue para ganhar mais.');modal('Confirmar compra',`<p>${E(i.name)} por <b class="textgold">${F(i.price)} moedas</b>?</p>`,`<button class="gold" data-confirmbuy="${id}">COMPRAR</button><button class="secondary" data-act="cancel">Cancelar</button>`)}
function confirmBuy(id){let i=items.find(x=>x.id===id);if(!i||data.coins<i.price)return closeModal();if(i.type==='theme'&&data.unlocked.includes(id))return closeModal();data.coins-=i.price;if(i.type==='help')data.stock[id]++;else{data.unlocked.push(id)}save();closeModal();render();toast('Compra realizada!')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.go)return go(d.go);if(d.mode){if(d.mode==='category')return go('categories');if(d.mode==='daily')return go('daily');return start(d.mode)}if(d.lockedcat){shopFilter='theme';return go('shop')}if(d.cat)return start('category',d.cat);if(d.appearance){data.settings.appearance=d.appearance;save();return render()}if(d.start)return start(d.start);if(d.answer!==undefined)return answer(+d.answer);if(d.life)return useLife(d.life);if(d.rankfilter){rankFilter=d.rankfilter;return render()}if(d.shopfilter){shopFilter=d.shopfilter;return render()}if(d.toggle){data.settings[d.toggle]=!data.settings[d.toggle];if(!data.settings.voice)stopVoice();save();return render()}if(d.buy)return buy(d.buy);if(d.confirmbuy)return confirmBuy(d.confirmbuy);switch(d.act){case'rename':return modal('Editar nome','<label for="nameinput" class="small">Nome do jogador</label><input class="field" id="nameinput" maxlength="24" autocomplete="off" value="'+E(data.name)+'">','<button class="gold" data-act="savename">SALVAR</button><button class="secondary" data-act="cancel">Cancelar</button>');case'savename':{let name=document.getElementById('nameinput').value.trim();if(!name)return toast('Digite um nome válido.');data.name=name;save();closeModal();return render()}case'reset':return modal('Resetar progresso','<p>Isso apagará nome, moedas, compras, ranking e estatísticas. Digite <b>CONFIRMAR</b> para continuar.</p><input class="field" id="resetinput" placeholder="CONFIRMAR" autocomplete="off">','<button class="secondary danger" data-act="resetconfirm" id="resetbutton" disabled>APAGAR TUDO</button><button class="secondary" data-act="cancel">Cancelar</button>');case'resetconfirm':if(document.getElementById('resetinput').value.trim()==='CONFIRMAR'){data=DEFAULT();save();closeModal();go('home');toast('Progresso reiniciado.')}return;case'cancel':return closeModal();case'quit':return confirmQuit();case'quitconfirm':closeModal();return finish('quit');case'read':return game&&speak(game.q.q,true);case'replay':return lastResult&&start(lastResult.mode,lastResult.cat);}});document.addEventListener('input',e=>{if(e.target.id==='resetinput')document.getElementById('resetbutton').disabled=e.target.value.trim()!=='CONFIRMAR'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal();else if(!modalOpen&&screen==='game'&&/^[1-4]$/.test(e.key))answer(+e.key-1)});render();save();if(!storageOK)toast('Armazenamento local indisponível: progresso não será salvo.');
</script><style>@media (max-width:700px){html,body{background:#080b21}#app{max-width:none;width:100%;box-shadow:none}}</style><script>(function(){try{var C=window.Capacitor;if(!C||!C.Plugins)return;var S=C.Plugins.StatusBar;if(S){S.setOverlaysWebView({overlay:true});S.hide();}}catch(e){}})();</script></body></html>
